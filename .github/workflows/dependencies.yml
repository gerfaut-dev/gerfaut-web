name: Dependencies

# Known advisories in the npm packages of package-lock.json, development
# ones included, checked by osv-scanner against osv-scanner.toml: on every
# push to main and every pull request that changes what it reads (the
# paths below), every Monday, and on demand (Actions, Dependencies, Run
# workflow). The weekly run is the one that catches an advisory published
# while nothing here changed; when it fails, GitHub notifies whoever last
# edited the cron line below. Main does not require this check, so a pull
# request it skips is not left waiting on it.
on:
  push:
    branches: [main]
    paths: [package-lock.json, package.json, osv-scanner.toml, .github/workflows/dependencies.yml]
  pull_request:
    paths: [package-lock.json, package.json, osv-scanner.toml, .github/workflows/dependencies.yml]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A pull request pushed again stops its previous run, which nobody will
# merge. Every other run has a group of its own: GitHub would otherwise
# drop a pending run on main when a newer one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # One version, checked against the hash its release publishes: a new
      # release changes nothing until it changes here.
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  $RUNNER_TEMP/bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Advisories from osv.dev, queried at every run.
      - name: Check the npm packages
        run: osv-scanner scan source --config osv-scanner.toml --lockfile package-lock.json
